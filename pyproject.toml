[project]
name = "prompt-gateway"
version = "0.1.0"
description = "Conservative prompt optimization gateway"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.6,<3", "httpx>=0.28,<1", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "redis>=5,<7", "alembic>=1.14,<2", "tiktoken>=0.9,<1", "opentelemetry-sdk>=1.30,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=6,<8", "ruff>=0.9,<1", "mypy>=1.14,<2", "openai>=1.60,<3", "respx>=0.22,<1", "aiosqlite>=0.20,<1", "hypothesis>=6,<7", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.format]
exclude = ["docs/project-specification.md"]

[tool.setuptools.package-data]
app = ["web/*.html", "web/*.css", "web/*.js"]
